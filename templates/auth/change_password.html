{% extends "base.html" %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white py-3 border-bottom text-center">
            <div class="avatar-circle mx-auto mb-2" style="width: 50px; height: 50px; background: rgba(30, 58, 138, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-key text-primary fa-lg"></i>
            </div>
            <h5 class="mb-0 fw-bold">Change Password</h5>
            <small class="text-muted">Ensure your account uses a strong and secure password</small>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('change_password') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Current Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="current_password" class="form-control" required placeholder="Enter current password">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-shield-alt text-muted"></i></span>
                        <input type="password" name="new_password" class="form-control" required placeholder="Enter new password (min 6 characters)">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-check-double text-muted"></i></span>
                        <input type="password" name="confirm_password" class="form-control" required placeholder="Re-enter new password">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-2">
                    <a href="/" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="fas fa-save me-1"></i> Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
